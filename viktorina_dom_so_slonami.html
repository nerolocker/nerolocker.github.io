<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дом со слонами — викторина</title>
<style>
:root{--bg:#0d0f10;--panel:#17191b;--panel2:#202326;--text:#f1f1ef;--muted:#9b9da0;--line:#303336;--yellow:#ffd400;--yellow2:#ffbf00;--good:#9be15d;--bad:#ff6b6b}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:920px;margin:auto;padding:28px 18px 60px}.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:#111416;min-height:320px;display:flex;align-items:flex-end;padding:34px}
.hero{background:linear-gradient(135deg,#17191b,#0d0f10)}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.38;filter:grayscale(1) contrast(1.05)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 15%,rgba(13,15,16,.94) 88%)}
.hero-content{position:relative;z-index:1}.eyebrow{color:var(--yellow);font-weight:800;text-transform:uppercase;letter-spacing:.16em;font-size:12px}
h1{font-size:clamp(38px,7vw,72px);line-height:.95;margin:10px 0}.hero p{max-width:650px;color:#c8c9ca;font-size:16px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 12px;color:var(--muted);font-size:14px}.progress{height:7px;background:#292b2e;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--yellow);width:20%;transition:.3s}
.card{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}
.qnum{color:var(--yellow);font-weight:800;font-size:13px}.question{font-size:clamp(24px,4vw,34px);line-height:1.15;margin:8px 0 22px}
.answers{display:grid;gap:12px}.answer{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:18px;border-radius:14px;text-align:left;font-size:16px;cursor:pointer;transition:.18s;display:flex;gap:12px;align-items:flex-start}
.answer:hover{border-color:#777;transform:translateY(-1px)}.answer b{color:var(--yellow);min-width:25px}
.answer.correct{border-color:var(--good);background:#1b2518}.answer.selected-correct{box-shadow:0 0 0 2px var(--good) inset}.answer.wrong{border-color:var(--bad);background:#281919}.answer:disabled{cursor:default;opacity:.95}
.feedback{margin-top:16px;padding:14px 16px;border-radius:12px;background:#111416;color:#cfd0d1;display:none}.feedback.show{display:block}.next{margin-top:16px;width:100%;border:0;border-radius:13px;padding:15px;background:var(--yellow);color:#111;font-weight:900;font-size:16px;cursor:pointer;display:none}.next.show{display:block}.next:hover{background:var(--yellow2)}
.result{text-align:center;padding:34px 18px}.score{font-size:64px;font-weight:950;color:var(--yellow);margin:5px}.result p{color:#bbb}.restart{border:0;border-radius:13px;padding:14px 22px;background:var(--yellow);font-weight:900;cursor:pointer}
.source{font-size:12px;color:#777;margin-top:18px}.source a{color:#aeb0b2}.foot{text-align:center;color:#67696c;font-size:12px;margin-top:24px}
@media(max-width:600px){.hero{min-height:360px;padding:24px}.card{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/%D0%94%D0%B0%D1%87%D0%B0%20%D0%93%D0%BE%D0%BB%D0%BE%D0%B2%D0%BA%D0%B8%D0%BD%D0%B0-1.jpg" alt="Дача Головкина" onerror="this.style.display='none'">
<div class="hero-content"><div class="eyebrow">Самара · модерн · история</div><h1>Дом со слонами</h1><p>Проверь, насколько хорошо ты знаешь одну из самых необычных достопримечательностей Самары.</p></div>
</section>

<div class="topbar"><span id="counter">Вопрос 1 из 5</span><span id="points">0 / 5</span></div>
<div class="progress"><i id="bar"></i></div>
<main id="quiz"></main>
<div class="foot">Фото: Wikimedia Commons · изображения загружаются по URL</div>
</div>

<script>
const questions=[
{q:"Кто поставил бетонных слонов на берегу Волги и зачем?",a:["Самарский купец, художник и меценат Константин Головкин в 1909 году. Он сам спроектировал дачу и создал скульптуры, чтобы их было видно с проплывающих по Волге кораблей.","Их заказал городской голова, чтобы отпугивать диких кабанов, которые выходили из Жигулёвских гор и портили огороды на набережной."],c:0,e:"Головкин был не только купцом, но и художником: необычный дом и скульптуры стали частью его авторского замысла."},
{q:"Почему современники считали этот дом архитектурным безумием?",a:["Из-за смелого использования бетона и асимметричного фасада в стиле венского сецессиона, который резко выделялся на фоне классических купеческих особняков.","Потому что Головкин выкрасил фасад в ярко-розовый цвет и установил на крыше вращающийся маяк, который слепил жителей соседней деревни."],c:0,e:"Необычная пластика, бетон и асимметрия сделали дачу совершенно непохожей на привычную купеческую архитектуру."},
{q:"Как заставить столетних каменных гигантов снова ожить?",a:["С помощью 3D-мэппинга и симфонического оркестра. В июне 2025 года световые проекции превратили бетонные фигуры в часть масштабного шоу.","Их натирают специальным маслом из семян волжской пальмы раз в год на Ивана Купалу, после чего слоны начинают шевелить ушами."],c:0,e:"Здесь сработали технологии: световые проекции и музыка создали эффект нового сценического образа знаменитых слонов."},
{q:"Что скрывает взгляд слонов, направленный на левый берег?",a:["Судьбу усадьбы: после революции 1917 года Головкин лишился дома, а внутри поочерёдно работали детский сад, госпиталь и конторы водоканала.","Согласно городской легенде, в полнолуние слоны сходят с постаментов, переходят на левый берег, купаются в Волге, а на рассвете возвращаются на свои места."],c:0,e:"История здания менялась вместе с городом: после революции у усадьбы были разные функции и владельцы."},
{q:"Спасем последний самарский модерн или оставим его разрушаться?",a:["Спасаем. Началась масштабная реставрация, дача признана объектом культурного наследия федерального значения.","Оставим разрушаться. По новому генплану Самары от 2025 года на месте дачи Головкина решено построить 25-этажный жилой комплекс «Жигулёвский слон» с панорамным остеклением."],c:0,e:"Комплекс имеет статус объекта культурного наследия федерального значения; после реставрации его территория была благоустроена."}
];

let i=0,score=0;
const quiz=document.getElementById("quiz"), counter=document.getElementById("counter"), points=document.getElementById("points"), bar=document.getElementById("bar");

function render(){
 counter.textContent=`Вопрос ${i+1} из ${questions.length}`;
 points.textContent=`${score} / ${questions.length}`;
 bar.style.width=`${(i/questions.length)*100}%`;
 const x=questions[i];
 quiz.innerHTML=`<section class="card"><div class="qnum">ВОПРОС ${i+1}</div><div class="question">${x.q}</div><div class="answers">
 ${x.a.map((v,n)=>`<button class="answer" onclick="answer(${n})"><b>${n===0?"A":"B"}</b><span>${v}</span></button>`).join("")}</div>
 <div id="feedback" class="feedback"></div><button id="next" class="next" onclick="next()">Следующий вопрос →</button></section>`;
}
function answer(n){
 const x=questions[i], btns=document.querySelectorAll(".answer");
 btns.forEach((b,k)=>{
   b.disabled=true;
   if(k===x.c) b.classList.add("correct");
   if(k===n) b.classList.add(n===x.c ? "selected-correct" : "wrong");
 });
 const feedback=document.getElementById("feedback");
 const isCorrect=n===x.c;
 if(isCorrect) score++;

 feedback.innerHTML=isCorrect
   ? `<div style="font-size:22px;font-weight:900;color:var(--good);margin-bottom:6px">✓ Верно!</div>
      <div>${x.e}</div>`
   : `<div style="font-size:22px;font-weight:900;color:var(--bad);margin-bottom:6px">✕ Неверно!</div>
      <div style="margin-bottom:8px">Ты выбрал неправильный вариант.</div>
      <div><strong style="color:var(--yellow)">Правильный ответ:</strong> ${x.a[x.c]}</div>
      <div style="margin-top:8px">${x.e}</div>`;
 feedback.classList.add("show");
 document.getElementById("next").classList.add("show");
 points.textContent=`${score} / ${questions.length}`;
}
function next(){
 i++;
 if(i<questions.length){render();window.scrollTo({top:0,behavior:"smooth"});return}
 bar.style.width="100%";counter.textContent="Викторина завершена";points.textContent=`${score} / ${questions.length}`;
 const title=score===5?"Архитектурный эксперт!":score>=3?"Отличный результат!":"Есть что ещё исследовать!";
 quiz.innerHTML=`<section class="card result"><div class="eyebrow">РЕЗУЛЬТАТ</div><h2>${title}</h2><div class="score">${score}/5</div><p>${score===5?"Ты знаешь историю Дома со слонами почти как местный краевед.":score>=3?"Хороший результат — Самара явно тебе знакома.":"Самое время ещё раз взглянуть на историю необычной дачи."}</p><button class="restart" onclick="restart()">Пройти ещё раз</button><div class="source">Фото: <a href="https://commons.wikimedia.org/wiki/File:%D0%94%D0%B0%D1%87%D0%B0_%D0%93%D0%BE%D0%BB%D0%BE%D0%B2%D0%BA%D0%B8%D0%BD%D0%B0-1.jpg" target="_blank" rel="noopener">Wikimedia Commons</a></div></section>`;
}
function restart(){i=0;score=0;render();window.scrollTo({top:0,behavior:"smooth"})}
render();
</script>
</body>
</html>
